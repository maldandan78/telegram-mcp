version: '3.8'

# Two service variants, selected by Compose profile:
#
#   stdio: the upstream service. Despite the profile name it now serves
#     upstream's unauthenticated streamable HTTP (MCP_TRANSPORT=http) on
#     127.0.0.1:8765 so several local MCP clients can share one container.
#
#   http: streamable-HTTP transport with OAuth 2.1 + PKCE. Intended for
#     remote deployment behind an HTTPS reverse proxy or Cloudflare Tunnel
#     so Claude Desktop's "Add custom connector" dialog can talk to it.
#
# Usage:
#   docker compose --profile stdio up        # local stdio mode
#   docker compose --profile http  up -d     # remote HTTP mode
#
# Both services read the same .env file -- the http profile relies on the
# TELEGRAM_MCP_* vars documented in Dockerfile and README.

services:
  telegram-mcp:
    profiles: ["stdio"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-mcp
    # Load environment variables from a .env file in the same directory
    env_file:
      - .env
    # Serve streamable HTTP so one long-lived container is shared by all MCP
    # clients (see the Transports section in README.md). MCP_HOST must be
    # 0.0.0.0 inside the container for the published port to work.
    environment:
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
    # The endpoint is unauthenticated — publish on localhost only.
    ports:
      - "127.0.0.1:8765:8765"
    # Optional: Uncomment the following lines to mount a local directory
    # for persisting the Telegram session file if NOT using TELEGRAM_SESSION_STRING.
    # Replace './telegram_sessions' with your desired host path.
    # volumes:
    #   - ./telegram_sessions:/app
    volumes:
      # Voice/video-note transcript cache (SQLite, see telegram_mcp/transcription.py).
      # Without this mount the cache lives only in the container's writable
      # layer and is lost on every `docker compose build`. It holds plaintext
      # personal-chat transcripts, so this directory should get its own
      # backup/retention policy rather than riding along with a general backup.
      # Host directory must be readable/writable by uid 1000 (appuser):
      #   mkdir -p ./transcript_cache && chown 1000:1000 ./transcript_cache
      - ./transcript_cache:/app/data/transcripts
    restart: unless-stopped

  telegram-mcp-http:
    profiles: ["http"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-mcp-http
    env_file:
      - .env
    environment:
      # Force the runner into HTTP mode regardless of what .env says.
      TELEGRAM_MCP_TRANSPORT: "http"
      TELEGRAM_MCP_HOST: "0.0.0.0"
      TELEGRAM_MCP_PORT: "8000"
      # Suppress the Dockerfile's TELEGRAM_SESSION_NAME default so it doesn't
      # spawn a phantom "default" file-based session when the user is running
      # in multi-account string-session mode (TELEGRAM_SESSION_STRING_<LABEL>).
      # If you want a default file-session account, set it explicitly in .env.
      TELEGRAM_SESSION_NAME: ""
      # Persist OAuth state (registered clients + access/refresh tokens) on
      # disk so Claude Desktop's connector doesn't re-run the OAuth flow
      # after every container restart. Without this it would default to an
      # in-memory store.
      TELEGRAM_MCP_OAUTH_DB: "/data/oauth.db"
    volumes:
      # Named volume backing TELEGRAM_MCP_OAUTH_DB.
      - oauth-data:/data
    # Bind to loopback only -- the public tunnel (Cloudflare / Tailscale
    # Funnel / etc.) reaches us over localhost. If you'd rather expose the
    # port publicly and put nginx/Caddy in front, drop the "127.0.0.1:" prefix.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

volumes:
  oauth-data:
